name: Build exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --clean --name CursorEngine --icon icon.ico --add-data "icon.ico;." --collect-all customtkinter cursor_engine.py
      - uses: actions/upload-artifact@v4
        with:
          name: CursorEngine
          path: dist/CursorEngine.exe
